spring.application.name=notificacao

#RABBITMQ CONFIG
spring.rabbitmq.host=localhost
spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq
spring.rabbitmq.port=5672

#RABBITMQ CUSTOM CONFIG
rabbitmq.exchange.name=exchange.v1.ecommerce-pedidos
rabbitmq.queue.name=queue.v1.ecommerce-pedido.fila.criado
rabbitmq.routing-key=pedido.criado

rabbitmq.queue.notificacao=queue.v1.ecommerce-pedido.fila.notificacao
rabbitmq.notificacao.routing-key=notificacao.enviada

#SPRING MAIL
spring.mail.host=localhost
spring.mail.port=1025
spring.mail.properties.mail.stmp.auth=false
spring.mail.properties.mail.stmp.starttls.enable=false
spring.mail.properties.mail.stmp.starttls.required=false


#REENVIO DE MENSAGENS
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.max-attempts=4
spring.rabbitmq.listener.simple.retry.initial-interval=5s
spring.rabbitmq.listener.simple.retry.multiplier=2

server.port=8083