spring.application.name=pedidos

spring.datasource.url=jdbc:postgresql://localhost:5432/db_pedidos
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.dd-auto:validate

#RABBITMQ CONFIG
spring.rabbitmq.host=localhost
spring.rabbitmq.username=rabbitmq
spring.rabbitmq.password=rabbitmq
spring.rabbitmq.port=5672

#RABBITMQ CUSTOM CONFIG
rabbitmq.exchange.name=exchange.v1.ecommerce-pedidos
rabbitmq.queue.name=queue.v1.ecommerce-pedido.fila.criado
rabbitmq.routing-key=pedido.criado

rabbitmq.queue.notificacao=queue.v1.ecommerce-pedido.fila.notificao
rabbitmq.notificacao.routing-key=notificacao.enviada

server.port=8081