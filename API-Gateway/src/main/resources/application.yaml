server:
  port: 8080

eureka:
  client:
    register-with-eureka: true
    fetch-registry: true
    serviceUrl:
      defaultZone: http://localhost:8761/eureka

spring:
  application:
    name: api.gateway
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: servico-produtos
              uri: lb://servico-produtos #procura no eureka um servico com esse nome
              predicates:
                - Path=/api/produtos/**

            - id: servico-pedidos
              uri: lb://servico-pedidos #procura no eureka um servico com esse nome
              predicates:
                - Path=/api/pedidos/**
      discovery:
        locator:
          enable: true
          lower-case-service-id: true

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
