server:
  port: 8080

spring:
  application:
    name: api.gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: servico-produtos
              uri: http://localhost:8081
              predicates:
                - Path=/api/produtos/**

            - id: servico-pedidos
              uri: http://localhost:8082
              predicates:
                - Path=/api/pedidos/**

logging:
  level:
    org.springframework.cloud.gateway: DEBUG
